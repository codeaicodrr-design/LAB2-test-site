<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №2 | Дмитрук Дмитро</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #58a6ff;
            font-size: 1.6rem;
            margin-top: 0;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }
        .info {
            margin: 15px 0;
            line-height: 1.6;
        }
        .info span {
            color: #8b949e;
        }
        .status {
            display: inline-block;
            background-color: rgba(35, 134, 54, 0.2);
            color: #3fb950;
            border: 1px solid #238636;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Лабораторна робота №2</h1>
        <div class="info">
            <p><strong>Тема:</strong> Базовий інструментарій роботи з хостингом</p>
            <p><strong>Студент:</strong> Дмитрук Дмитро</p>
            <p><strong>Група:</strong> ІПЗ-31</p>
            <p><span>Деплой виконано через Vercel & GitHub</span></p>
        </div>
        <div class="status">✓ Хостинг успішно налаштовано</div>
    </div>
</body>
</html>
